name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked

  msrv:
    name: msrv (1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.96 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.96 check --workspace --all-targets --locked

  action:
    name: setup-loadout action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p loadout-cli
      - name: Pinned sandbox setup (what a repo would commit)
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sandbox"
          mkdir -p "$root/home/.claude" "$root/src/skills/hello"
          printf -- '---\nloadout: 1\nname: ci-skills\nlayer: role\ngroup: ci\n---\n' > "$root/src/LOADOUT.md"
          printf -- '---\ndescription: Hello.\n---\nHi.\n' > "$root/src/skills/hello/SKILL.md"
          git -C "$root/src" init -q -b main
          git -C "$root/src" -c user.name=ci -c user.email=ci@example.com add -A
          git -C "$root/src" -c user.name=ci -c user.email=ci@example.com commit -q -m init
          {
            echo "LOADOUT_HOME=$root/home"
            echo "LOADOUT_CONFIG_DIR=$root/config"
            echo "LOADOUT_DATA_DIR=$root/data"
          } >> "$GITHUB_ENV"
          export LOADOUT_HOME="$root/home" LOADOUT_CONFIG_DIR="$root/config" LOADOUT_DATA_DIR="$root/data"
          target/debug/lo subscribe "$root/src"
          target/debug/lo sync
          # A fresh machine: keep config + lock, drop everything else.
          rm -rf "$root/data/repos" "$root/data/store" "$root/home/.claude/skills"
      - uses: ./shims/github-action
        with:
          binary: target/debug/lo
      - name: Installed exactly the pinned configuration
        run: |
          set -euo pipefail
          test -f "$LOADOUT_HOME/.claude/skills/hello/SKILL.md"
          lo status
