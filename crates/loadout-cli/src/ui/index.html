<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loadout</title>
<style>
  :root {
    --bg:#f7f6f3; --panel:#ffffff; --sunken:#f0eee9; --fg:#1c1b19; --muted:#6a665f; --faint:#9a958c;
    --line:#e3e0d9; --line-strong:#d2cec5; --accent:#2f5d8a; --accent-soft:#e6eef6; --accent-fg:#ffffff;
    --ok:#2c7a4b; --ok-soft:#e3f1e8; --warn:#9a5d12; --warn-soft:#f8eddc; --bad:#a3372b; --bad-soft:#f7e3e0;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
    --radius:10px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#141518; --panel:#1b1d21; --sunken:#17191c; --fg:#e9e7e2; --muted:#a09b92; --faint:#6f6b64;
      --line:#2a2d32; --line-strong:#383c42; --accent:#86b4e3; --accent-soft:#1f2c3a; --accent-fg:#0f1720;
      --ok:#74c795; --ok-soft:#1b2c22; --warn:#e3a95f; --warn-soft:#2f2517; --bad:#ec8173; --bad-soft:#321c1a;
      --shadow:0 1px 2px rgba(0,0,0,.3);
    }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body { font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  code, .mono { font-family:var(--mono); font-size:12.5px; }
  a { color:var(--accent); }
  .app { display:grid; grid-template-columns:220px 1fr; min-height:100vh; }
  aside { border-right:1px solid var(--line); padding:18px 12px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:4px; background:var(--sunken); }
  .brand { display:flex; align-items:center; gap:8px; font-weight:650; font-size:15px; padding:2px 8px 14px; }
  .brand .logo { width:24px; height:24px; border-radius:7px; background:var(--accent); color:var(--accent-fg); display:grid; place-items:center; font-size:13px; font-weight:700; }
  nav button { display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left; background:none; border:0; padding:7px 10px; border-radius:7px; color:var(--muted); cursor:pointer; font:inherit; }
  nav button:hover { background:var(--panel); color:var(--fg); }
  nav button.on { background:var(--panel); color:var(--fg); box-shadow:inset 0 0 0 1px var(--line); font-weight:550; }
  nav .count { font-size:11px; background:var(--warn-soft); color:var(--warn); border-radius:9px; padding:0 7px; }
  .side-foot { margin-top:auto; padding:8px; font-size:12px; color:var(--faint); }
  #about { margin-top:6px; } #about a { color:var(--faint); } #about .update { color:var(--accent); font-weight:600; } #about .mono { white-space:nowrap; }
  main { padding:24px 28px 80px; max-width:1180px; width:100%; }
  .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
  h1 { font-size:21px; margin:0; font-weight:650; letter-spacing:-.01em; }
  h2 { font-size:15px; margin:0 0 10px; font-weight:620; }
  .sub { color:var(--muted); margin-top:3px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; box-shadow:var(--shadow); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:14px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow); }
  .tile .n { font-size:26px; font-weight:650; letter-spacing:-.02em; }
  .tile .l { color:var(--muted); font-size:12.5px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:last-child td { border-bottom:0; }
  th { color:var(--muted); font-weight:550; font-size:12px; }
  .muted { color:var(--muted); } .faint { color:var(--faint); }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .btn { font:inherit; font-size:13px; padding:5px 11px; border-radius:7px; border:1px solid var(--line-strong); background:var(--panel); color:var(--fg); cursor:pointer; white-space:nowrap; }
  .btn:hover { border-color:var(--faint); }
  .btn.primary { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .btn.ghost { border-color:transparent; background:none; color:var(--muted); }
  .btn.ghost:hover { color:var(--fg); background:var(--sunken); }
  .btn:disabled { opacity:.5; cursor:default; }
  input[type=text], input[type=search], select, textarea { font:inherit; padding:6px 9px; border:1px solid var(--line-strong); border-radius:7px; background:var(--panel); color:var(--fg); min-width:0; }
  input:focus, select:focus, textarea:focus, .btn:focus-visible, nav button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  textarea { width:100%; min-height:320px; font-family:var(--mono); font-size:12.5px; }
  pre { white-space:pre-wrap; overflow-x:auto; background:var(--sunken); border:1px solid var(--line); border-radius:8px; padding:10px; font-family:var(--mono); font-size:12px; margin:8px 0 0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row + .row { margin-top:8px; }
  .grow { flex:1; }
  .pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11.5px; font-weight:550; border:1px solid transparent; white-space:nowrap; }
  .pill.enabled { background:var(--ok-soft); color:var(--ok); }
  .pill.disabled { background:var(--sunken); color:var(--muted); border-color:var(--line); }
  .pill.shadowed { background:var(--warn-soft); color:var(--warn); }
  .pill.not-for-you, .pill.not-subscribed { background:var(--accent-soft); color:var(--accent); }
  .chip { display:inline-block; padding:0 7px; border-radius:6px; font-size:11.5px; background:var(--sunken); color:var(--muted); border:1px solid var(--line); margin:2px 4px 0 0; }
  .row.nowrap { flex-wrap:nowrap; }
  label.check { display:flex; gap:8px; align-items:flex-start; margin-top:6px; }
  label.check input { margin-top:3px; flex:none; }
  .row.nowrap input { flex:1; min-width:0; }
  .byline { color:var(--muted); font-size:12px; margin-top:2px; }
  .byline b { font-weight:560; color:var(--fg); }
  .authoring { display:flex; gap:2px; margin:4px 0 0 -8px; flex-wrap:wrap; }
  .authoring .btn { font-size:12px; padding:2px 8px; }
  .copy-group h3 { margin-bottom:6px; }
  .copy-opt { display:flex; gap:8px; align-items:center; padding:6px 8px; border:1px solid var(--line); border-radius:7px; margin-bottom:6px; cursor:pointer; flex-wrap:wrap; }
  .copy-opt:has(input:checked) { border-color:var(--accent); background:var(--accent-soft); }
  .copy-opt .n { font-weight:560; }
  .chip.role { background:var(--accent-soft); color:var(--accent); border-color:transparent; }
  .kind { font-family:var(--mono); font-size:11px; color:var(--faint); text-transform:uppercase; letter-spacing:.04em; }
  /* Catalog */
  .catalog { display:grid; grid-template-columns:230px 1fr; gap:18px; align-items:start; }
  .filters { position:sticky; top:16px; }
  .filters > summary { font-weight:650; cursor:pointer; list-style:none; margin-bottom:10px; }
  .filters > summary::-webkit-details-marker { display:none; }
  .filters:not([open]) > summary { margin-bottom:0; }
  .filters:not([open]) > summary::after { content:" ▸"; color:var(--faint); }
  .facet { margin-bottom:14px; }
  .facet h3 { font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); margin:0 0 6px; font-weight:600; }
  .facet label { display:flex; align-items:center; gap:7px; padding:2px 4px; border-radius:5px; cursor:pointer; font-size:13px; }
  .facet label:hover { background:var(--sunken); }
  .facet label .c { margin-left:auto; color:var(--faint); font-size:11.5px; }
  .facet .more { font-size:12px; color:var(--accent); background:none; border:0; cursor:pointer; padding:2px 4px; }
  .items { display:flex; flex-direction:column; gap:8px; }
  .item { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; display:grid; grid-template-columns:1fr auto; gap:10px; }
  .item .title { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .item .name { font-weight:600; }
  .item .src { color:var(--muted); font-size:12.5px; }
  .item .desc { margin-top:3px; }
  .item .acts { display:flex; gap:6px; align-items:flex-start; }
  .searchbar { display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .searchbar input[type=search] { flex:1; min-width:200px; padding:8px 11px; }
  .empty { text-align:center; padding:36px 10px; color:var(--muted); }
  /* Sources tree */
  .tree { list-style:none; margin:0; padding:0; }
  .tree .tree { margin-left:22px; border-left:1px dashed var(--line-strong); padding-left:12px; }
  .node { display:flex; gap:10px; align-items:center; padding:8px 0; flex-wrap:wrap; }
  .node .n { font-weight:600; }
  .badge { font-size:11px; padding:0 7px; border-radius:6px; border:1px solid var(--line); color:var(--muted); }
  .badge.upstream { border-color:transparent; background:var(--accent-soft); color:var(--accent); }
  details.src-preview { border-top:1px solid var(--line); padding:8px 0; }
  details.src-preview summary { cursor:pointer; list-style:none; display:flex; gap:8px; align-items:center; }
  details.src-preview summary::before { content:"▸"; color:var(--faint); width:10px; }
  details.src-preview[open] summary::before { content:"▾"; }
  .drawer { position:fixed; right:0; top:0; bottom:0; width:min(560px,100%); background:var(--panel); border-left:1px solid var(--line); padding:20px; overflow:auto; transform:translateX(100%); visibility:hidden; transition:transform .18s ease, visibility .18s; z-index:20; }
  .drawer.wide { width:min(780px,100%); }
  .drawer h3 { font-size:13.5px; margin:18px 0 8px; font-weight:620; }
  .var-row { margin-bottom:6px; }
  .drawer.open { transform:none; visibility:visible; box-shadow:-8px 0 24px rgba(0,0,0,.12); }
  .form-grid { display:grid; grid-template-columns:160px 1fr; gap:8px 12px; align-items:center; }
  .form-grid .hint { grid-column:2; color:var(--faint); font-size:12px; margin-top:-4px; }
  .nav-group { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); padding:12px 10px 3px; font-weight:600; }
  .help-btn { margin-top:12px; text-align:left; font-size:12.5px; white-space:normal; }
  details.explain { background:var(--accent-soft); border-radius:var(--radius); padding:10px 14px; margin:-6px 0 14px; }
  details.explain summary { cursor:pointer; color:var(--accent); font-weight:600; font-size:13px; }
  details.explain p { margin:6px 0 0; max-width:78ch; }
  dl.glossary dt { font-weight:620; margin-top:12px; }
  dl.glossary dd { margin:2px 0 0; color:var(--muted); }
  .steps3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .step3 { background:var(--sunken); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; position:relative; }
  .step3 .num { width:24px; height:24px; border-radius:50%; background:var(--accent); color:var(--accent-fg); display:inline-grid; place-items:center; font-weight:700; font-size:12.5px; margin-bottom:6px; }
  .step3 b { display:block; }
  .step3:not(:last-child)::after { content:"→"; position:absolute; right:-11px; top:50%; transform:translateY(-50%); color:var(--faint); }
  .steps3.plain .step3::after { content:none; }
  .steps3.plain .step3 { display:flex; flex-direction:column; align-items:flex-start; }
  .steps3.plain .step3 .btn { margin-top:auto; }
  ol.flow { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:0; padding:0; list-style:none; counter-reset:f; }
  ol.flow li { counter-increment:f; background:var(--sunken); border-radius:8px; padding:10px 12px; color:var(--muted); }
  ol.flow li::before { content:counter(f); display:inline-grid; place-items:center; width:20px; height:20px; border-radius:50%; background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:11.5px; margin-right:6px; }
  ol.flow li b { color:var(--fg); }
  .checklist { list-style:none; margin:0; padding:0; }
  .checklist li { display:grid; grid-template-columns:30px 1fr auto; gap:12px; align-items:center; padding:12px 0; border-top:1px solid var(--line); }
  .checklist li:first-child { border-top:0; }
  .checklist .tick { width:26px; height:26px; border-radius:50%; border:2px solid var(--line-strong); display:grid; place-items:center; font-weight:700; color:var(--faint); font-size:13px; }
  .checklist li.done .tick { background:var(--ok); border-color:var(--ok); color:var(--panel); }
  .checklist li.next { background:var(--accent-soft); margin:0 -18px; padding:12px 18px; border-radius:8px; border-top-color:transparent; }
  .checklist li.next .tick { border-color:var(--accent); color:var(--accent); }
  .checklist li.done .t { color:var(--muted); }
  .checklist .t { font-weight:600; }
  .progress { height:6px; background:var(--sunken); border-radius:3px; overflow:hidden; margin:6px 0 4px; }
  .progress > div { height:100%; background:var(--ok); }
  .lede { font-size:15px; max-width:70ch; margin:0 0 4px; }
  /* Layers */
  .layers { list-style:none; margin:0; padding:0; position:relative; }
  .layer { position:relative; padding-left:34px; margin-bottom:14px; }
  .layer::before { content:""; position:absolute; left:11px; top:28px; bottom:-14px; border-left:2px solid var(--line-strong); }
  .layer:last-child::before { display:none; }
  .layer .dot { position:absolute; left:0; top:14px; width:24px; height:24px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-size:11px; font-weight:700; border:2px solid var(--panel); }
  .layer.empty-layer .dot { background:var(--sunken); color:var(--faint); }
  .layer .card { margin-bottom:0; }
  .layer-head { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  .layer-head h2 { margin:0; text-transform:capitalize; }
  .group { border-top:1px solid var(--line); padding:10px 0 4px; margin-top:10px; }
  .group-head { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:6px; }
  .group-head .n { font-weight:600; }
  .litem { display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:start; padding:6px 0 6px 12px; border-left:2px solid var(--line); margin-left:4px; }
  .litem + .litem { margin-top:2px; }
  .litem.win { border-left-color:var(--ok); }
  .litem.lose { opacity:.8; }
  .litem .note { font-size:12.5px; color:var(--muted); }
  .litem > .pill { justify-self:start; }
  .chain { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .chain .chip { font-size:13px; padding:2px 10px; margin:0; }
  .litem .acts { display:flex; gap:6px; flex-wrap:nowrap; }
  .layer-legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin-bottom:12px; }
  #toast { position:fixed; bottom:18px; right:18px; max-width:520px; padding:11px 15px; border-radius:9px; background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow); display:none; white-space:pre-wrap; z-index:30; }
  #toast.bad { border-color:var(--bad); color:var(--bad); }
  @media (max-width: 860px) {
    .app { grid-template-columns:1fr; }
    aside { position:static; height:auto; flex-direction:row; flex-wrap:wrap; padding:10px 12px; border-right:0; border-bottom:1px solid var(--line); }
    .brand { padding:4px 8px; width:100%; }
    nav { display:flex; flex-wrap:wrap; gap:2px; }
    nav button { width:auto; }
    .side-foot { display:none; }
    main { padding:16px; }
    .catalog { grid-template-columns:1fr; }
    .filters { position:static; }
    .item { grid-template-columns:1fr; }
    .form-grid { grid-template-columns:1fr; }
    .form-grid .hint { grid-column:1; }
    .nav-group { display:none; }
    .help-btn { margin-top:0; }
    .steps3, ol.flow { grid-template-columns:1fr; }
    .step3:not(:last-child)::after { content:"↓"; right:auto; left:50%; top:auto; bottom:-15px; transform:none; }
    .checklist li { grid-template-columns:30px 1fr; }
    .litem { grid-template-columns:1fr; }
    .checklist li > :last-child { grid-column:2; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="logo">L</span>Loadout</div>
    <nav id="nav"></nav>
    <button class="btn ghost help-btn" onclick="glossary()">? What do these words mean</button>
    <div class="side-foot"><div id="last-sync"></div><div id="fp" class="mono" title="Your setup's fingerprint: two people with the same one have the same setup"></div><div id="about"></div></div>
  </aside>
  <main id="main"></main>
</div>
<div id="drawer" class="drawer" role="dialog" aria-modal="false"></div>
<div id="toast" role="status"></div>
<script>
"use strict";
const token = new URLSearchParams(location.search).get("token") || "";
// [id (URL hash), label, group, hint]. Ids stay stable for links.
const tabs = [
  ["Start", "Start here", "", "A guided tour and your setup checklist"],
  ["Overview", "Home", "Use", "Your setup at a glance"],
  ["Catalog", "Browse skills", "Use", "Everything you can get, with filters"],
  ["Layers", "Your layers", "Use", "Which group each skill comes from, and which version wins"],
  ["Targets", "AI tools", "Use", "The AI tools Loadout installs into"],
  ["Review", "Updates", "Use", "Changes waiting for your OK"],
  ["Sources", "Sources", "Share", "Where skills come from"],
  ["Templates", "Templates", "Share", "Fill-in-the-blanks skills"],
  ["Edit", "Create & edit", "Share", "Write skills and propose changes"],
  ["Doctor", "Health check", "Fix", "Problems with this computer's setup"],
];
let current = "Overview";
let pendingCount = 0;

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) e[k] = v;
    else if (k === "checked" || k === "selected" || k === "disabled" || k === "open") e[k] = !!v;
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) if (k !== null && k !== undefined && k !== false) e.append(k instanceof Node ? k : document.createTextNode(k));
  return e;
}
function toast(msg, bad) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = bad ? "bad" : ""; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = "none"), bad ? 9000 : 5000);
}
async function api(path, body) {
  const opts = { headers: { "X-Loadout-Token": token } };
  if (body !== undefined) { opts.method = "POST"; opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  if (j.output && j.output.error) throw new Error(j.output.error);
  return j.output;
}
const VERBS = { enable: "Turned on", disable: "Turned off", prefer: "Now using", join: "Joined", leave: "Left", subscribe: "Added", unsubscribe: "Removed", sync: "Updated", approve: "Approved" };
const friendly = args => VERBS[args[0]] ? [VERBS[args[0]], ...args.slice(1).filter(a => !a.startsWith("-"))].join(" ") : "lo " + args.join(" ") + ": done";
async function run(args, label, refresh = true) {
  try {
    const out = await api("/api/run", { args });
    const w = (out.warnings || []).join("\n");
    toast((label || friendly(args)) + (w ? "\n" + w : ""));
    if (refresh) await show(current, undefined, true);
    return out;
  } catch (e) { toast(e.message, true); throw e; }
}
const tbl = (head, rows) => el("table", {}, el("thead", {}, el("tr", {}, head.map(h => el("th", {}, h)))), el("tbody", {}, rows));
const short = s => (s || "").slice(0, 8);
// A page's heading plus its "About this page" explainer (HELP[id]).
function pageHead(id, sub, ...right) {
  const label = (tabs.find(t => t[0] === id) || [])[1] || id;
  const f = document.createDocumentFragment();
  f.append(el("div", { class: "page-head" }, el("div", {}, el("h1", {}, label), el("div", { class: "sub" }, sub)), el("div", { class: "row" }, right)));
  if (HELP[id]) f.append(explainer(id, HELP[id]));
  return f;
}
const syncBtn = () => el("button", { class: "btn primary", title: "Download the latest from your sources and install it into your AI tools (lo sync)", onclick: () => run(["sync"], "Updated") }, "Update now");

// Plain-language names for item states and kinds.
const STATES = {
  "enabled": ["On", "Your AI tools have this"],
  "disabled": ["Off", "Available, but turned off. Turn it on to use it"],
  "shadowed": ["Replaced", "Another group has its own version, and theirs is used because it's more specific"],
  "not-for-you": ["Not for your role", "Shared only with a role you don't have"],
  "not-subscribed": ["Not in your groups", "Shared with a group you're not in"],
};
const stateLabel = st => (STATES[st] || [st.replace(/-/g, " ")])[0];
const KINDS = { skill: "Skill", mcp: "Tool connection", agent: "Subagent", plugin: "Plugin", extra: "Rule or prompt" };
const kindLabel = k => KINDS[k] || k;
function ago(t) {
  if (!t) return "never";
  const s = (Date.now() - Date.parse(t)) / 1000;
  if (!(s >= 0)) return t;

      fields[k] = ["co_authors", "tags", "roles"].includes(k) ? list(now[k]) : now[k];
    }
    if (fields.tags && fields.tags.some(t => !KEBAB.test(t))) { toast("Tags: kebab-case words.", true); return; }
    if (!Object.keys(fields).length) { toast("Nothing changed"); return; }

      el("label", {}, "Tags"), f.tags,
      el("label", {}, "Mode"), f.mode,

      el("label", {}, "Instructions"), f.body),

  const fileView = el("div", { hidden: true }, raw,

  tForm.onclick = () => r.meta ? pick(true) : toast("The frontmatter doesn't parse; fix it in the whole-file view first.", true);

      el("button", { class: "btn ghost", onclick: () => copyItem(source, key) }, "Copy to another layer…")),

// Copy an item to another source: promote it to a broader layer, or clone
// it down to a closer one and customize it there.
async function copyItem(source, key) {
  let srcs, lay;
  let item;
  try {
    [srcs, lay, item] = await Promise.all([api("/api/sources"), api("/api/layers"), api(`/api/source-item?source=${encodeURIComponent(source)}&key=${encodeURIComponent(key)}`)]);
  } catch (e) { toast(e.message, true); return; }
  if (!item.text) { toast(`${source} has no ${key} in your working copy`, true); return; }
  const rank = new Map(lay.layers.map(s => [s.name, s.rank]));
  const from = srcs.sources.find(s => s.name === source) || { name: source };
  const fr = rank.get(from.layer);
  const dir = s => { const r = rank.get(s.layer); return r === undefined || fr === undefined || r === fr ? "same" : r < fr ? "up" : "down"; };
  const others = srcs.sources.filter(s => s.name !== source);
  if (!others.length) { toast("You need a second source to copy into. Add one on the Sources page.", true); return; }
  const remove = el("input", { type: "checkbox" }), coauthor = el("input", { type: "checkbox" });
  const removeLabel = el("span"), go = el("button", { class: "btn primary" }), hint = el("div", { class: "muted", style: "margin-top:6px" });
  const result = el("div");
  let to = null;
  const choose = s => {
    to = s;
    const d = dir(s);
    remove.checked = d === "up"; coauthor.checked = d !== "up";
    removeLabel.textContent = d === "up" ? `Remove it from ${source} (recommended: otherwise ${source}'s copy keeps replacing the shared one for its group)` : `Move it: remove it from ${source}`;
    go.textContent = d === "up" ? "Promote" : d === "down" ? "Clone and edit" : "Copy";
    hint.textContent = d === "up" ? `Everyone in ${s.layer}${s.group ? ":" + s.group : ""} gets it once ${s.name}'s owners merge the pull request.`
      : d === "down" ? `Your copy in ${s.name} replaces ${source}'s version for ${s.layer}${s.group ? ":" + s.group : ""}, unless ${source} has locked it.`
      : "Both sources are at the same layer; people in both get whichever wins the tie.";
  };
  const group = (title, d, blurb) => {
    const opts = others.filter(s => dir(s) === d);
    if (!opts.length) return null;
    return el("div", { class: "copy-group" }, el("h3", {}, title), el("div", { class: "muted", style: "margin:-4px 0 6px" }, blurb),
      opts.map(s => el("label", { class: "copy-opt" }, el("input", { type: "radio", name: "copy-to", onchange: () => choose(s) }),
        el("span", { class: "n" }, s.name), el("span", { class: "chip" }, `${s.layer || "?"}${s.group ? ":" + s.group : ""}`), rank.has(s.layer) ? el("span", { class: "faint" }, `rank ${rank.get(s.layer)}`) : null)));
  };
  const run = async () => {
    if (!to) { toast("Pick where to copy it", true); return; }
    try {
      const r = await api("/api/copy-item", { key, from: source, to: to.name, remove: remove.checked, co_author: coauthor.checked });
      const d = dir(to);
      const msg = el("input", { type: "text", class: "grow", value: d === "up" ? `Promote ${key} from ${source}` : `Add our own ${key} (from ${source})`, "aria-label": "Pull request title" });
      const msgFrom = el("input", { type: "text", class: "grow", value: `Remove ${key} (moved to ${to.name})`, "aria-label": "Pull request title" });
      result.replaceChildren(el("div", { class: "card", style: "margin-top:14px" },
        el("div", { class: "ok" }, `${r.moved ? "Moved" : "Copied"} ${key} to ${to.name}`), el("div", { class: "mono muted" }, r.path),
        r.co_author_added ? el("div", { class: "muted" }, `Added ${r.co_author_added} as a co-author.`) : null,
        (r.warnings || []).map(w => el("div", { class: "warn" }, w)),
        el("div", { class: "row", style: "margin-top:10px" }, el("button", { class: "btn" + (d === "up" ? "" : " primary"), onclick: () => editItem(to.name, key) }, "Edit the copy")),
        el("div", { class: "row" }, msg, el("button", { class: "btn" + (d === "up" ? " primary" : ""), onclick: () => exportPr(to.name, msg.value) }, `Open pull request for ${to.name}`)),
        r.moved ? el("div", { class: "row" }, msgFrom, el("button", { class: "btn", onclick: () => exportPr(source, msgFrom.value) }, `Open pull request for ${source}`)) : null));
    } catch (e) { toast(e.message, true); }
  };
  go.onclick = run;
  const asTemplate = key.startsWith("skill/") ? el("div", { class: "card", style: "margin-top:14px" },
    el("b", {}, "Or make it a template"), el("div", { class: "muted", style: "margin:2px 0 8px" }, "Each team fills in its own details (like {{team}}) and gets its own copy, instead of one shared version."),
    el("button", { class: "btn", onclick: () => {
      newTemplate(srcs.sources, { name: key.split("/")[1] + "-template", description: (item.meta && item.meta.description) || "", body: item.body || item.text, vars: [], into: (to || from).name });
      toast("Now replace the team-specific parts with blanks like {{team}}.");
    } }, "Turn into a template…")) : null;
  openDrawer(el("h2", {}, "Copy ", el("code", {}, key), " to another layer"),
    el("p", { class: "muted" }, "From ", el("span", { class: "mono" }, source), from.layer ? ` (${from.layer}${from.group ? ":" + from.group : ""})` : "", ". The copy goes to your working copy of the other source; nothing is shared until its pull request is merged."),
    group("Promote: share it more widely", "up", "A broader layer, so more people get it."),
    group("Clone down: make your own version", "down", "A layer closer to you. Your copy replaces this one for that group, and you can change it."),
    group("Same layer", "same", "Another source at the same layer."),
    el("div", { style: "margin-top:12px" },
      el("label", { class: "check muted" }, remove, removeLabel),
      el("label", { class: "check muted" }, coauthor, "Add me as a co-author of the copy")),
    hint,
    el("div", { class: "row", style: "margin-top:12px" }, go),
    result, asTemplate);
  const first = others.find(s => dir(s) === "down") || others[0];
  const radios = [...document.querySelectorAll('#drawer input[name="copy-to"]')];
  const idx = ["up", "down", "same"].flatMap(d => others.filter(s => dir(s) === d)).indexOf(first);
  if (radios[idx]) radios[idx].checked = true;
  choose(first);
}

const KEBAB = /^[a-z0-9]+(-[a-z0-9]+)*$/;
const list = s => s.split(",").map(x => x.trim()).filter(Boolean);

// SKILL.md from the form. Values are JSON-quoted (valid YAML); the `loadout:`
// keys follow schemas/item-block.schema.json.
function skillText(f) {
  const q = JSON.stringify;
  const lines = ["---", `name: ${f.name}`, `description: ${q(f.description)}`];
  const g = [];
  if (f.mode) g.push(`  mode: ${f.mode}`);
  if (f.tags.length) g.push(`  tags: ${q(f.tags)}`);
  if (f.roles.length) g.push("  applies_to:", `    role: ${q(f.roles)}`);
  if (f.locked) g.push("  locked: true");
  if (f.author) g.push(`  author: ${q(f.author)}`);
  if (f.co_authors.length) g.push(`  co_authors: ${q(f.co_authors)}`);
  if (g.length) lines.push("loadout:", ...g);
  lines.push("---", "", f.body.trim() || `# ${f.name || "Skill"}\n\nThe steps the agent should follow.`, "");
  return lines.join("\n");
}

function newSkill(sources, source) {
  const into = el("select", { "aria-label": "Source" }, srcOptions(sources, source));
  const name = el("input", { type: "text", placeholder: "write-spec", "aria-label": "Name" });
  const desc = el("textarea", { style: "min-height:64px", placeholder: "Write a feature spec in our format. Use when asked for a spec, PRD or design doc.", "aria-label": "Description" });
  const mode = el("select", { "aria-label": "Mode" },
    [["", "source default"], ["default-on", "default-on: installed, can be turned off"], ["default-off", "default-off: people opt in"], ["required", "required: can't be turned off"]]
      .map(([v, l]) => el("option", { value: v }, l)));
  const tags = el("input", { type: "text", placeholder: "specs, writing", "aria-label": "Tags" });
  const roles = el("input", { type: "text", placeholder: "developer, product-manager (empty: everyone)", "aria-label": "Roles" });
  const locked = el("input", { type: "checkbox", "aria-label": "Locked" });
  const author = el("input", { type: "text", placeholder: "Who wrote it", "aria-label": "Author" });
  const coAuthors = el("input", { type: "text", placeholder: "Others who helped, separated by commas", "aria-label": "Co-authors" });
  me().then(n => { if (n && !author.value) { author.value = n; update(); } });
  const body = el("textarea", { style: "min-height:160px", placeholder: "# Writing a spec\n\n1. …", "aria-label": "Instructions" });
  const preview = el("pre", { class: "mono", style: "white-space:pre-wrap;background:var(--sunken);padding:10px;border-radius:7px;font-size:12px;max-height:240px;overflow:auto" });
  const problems = el("div", { class: "warn" });
  const result = el("div");
  const form = () => ({ name: name.value.trim(), description: desc.value.trim().replace(/\s+/g, " "), mode: mode.value, tags: list(tags.value), roles: list(roles.value), locked: locked.checked,
    author: author.value.trim(), co_authors: list(coAuthors.value), body: body.value });
  const check = f => [
    !KEBAB.test(f.name) && "Name: lowercase letters, digits and single '-' (e.g. write-spec).",
    !f.description && "Description: say what the skill does and when to use it.",
    f.description && !/\buse (it )?(when|for|to)\b/i.test(f.description) && "Tip: end the description with \"Use when …\" so agents know when to load it.",
    f.tags.some(t => !KEBAB.test(t)) && "Tags: kebab-case words.",
  ].filter(Boolean);
  const update = () => { const f = form(); preview.textContent = skillText(f); problems.replaceChildren(...check(f).map(p => el("div", {}, p))); };
  for (const i of [name, desc, mode, tags, roles, locked, author, coAuthors, body]) i.oninput = i.onchange = update;
  const create = async () => {
    const f = form();
    const bad = check(f).filter(p => !p.startsWith("Tip"));
    if (bad.length) { toast(bad.join("\n"), true); return; }
    const key = "skill/" + f.name;
    try {
      const existing = await api(`/api/source-item?source=${encodeURIComponent(into.value)}&key=${encodeURIComponent(key)}`);
      if (existing.text) { toast(`${into.value} already has ${key}; load it in the editor instead`, true); return; }
      const r = await api("/api/source-item", { source: into.value, key, text: skillText(f) });
      result.replaceChildren(createdCard(into.value, key, r.path));
    } catch (e) { toast(e.message, true); }
  };
  update();
  openDrawer(el("h2", {}, "New skill"),
    el("p", { class: "muted" }, "A skill is a short description (so the AI knows when to use it) plus the steps to follow. It's saved to your working copy; nothing is shared until a pull request is merged."),
    el("div", { class: "form-grid" },
      el("label", {}, "Source"), into,
      el("label", {}, "Name"), name,
      el("label", {}, "Description"), desc, el("div", { class: "hint" }, "What it does, then \"Use when …\". Agents load skills based on this."),
      el("label", {}, "Mode"), mode,
      el("label", {}, "Tags"), tags,
      el("label", {}, "Only for roles"), roles,
      el("label", {}, "Locked"), el("label", { class: "row muted" }, locked, "Lower layers can't turn it off or replace it"),
      el("label", {}, "Author"), el("div", { class: "row nowrap" }, author, meButton(author)),
      el("label", {}, "Co-authors"), el("div", { class: "row nowrap" }, coAuthors, meButton(coAuthors, true)),
      el("label", {}, "Instructions"), body),
    problems,
    el("h3", { style: "margin-top:14px" }, "SKILL.md"), preview,
    el("div", { class: "row", style: "margin-top:14px" }, el("button", { class: "btn primary", onclick: create }, "Create skill")), result);
}

async function adoptSkills(sources, source) {
  const into = el("select", { "aria-label": "Destination source" }, sources.map(s => el("option", { value: s.name, selected: s.name === source }, s.name)));
  const folder = el("input", { type: "text", class: "grow", placeholder: "Your AI tools' skills folders, or a folder like ~/work/repo/.claude/skills", "aria-label": "Folder" });
  const found = el("div");
  const result = el("div");
  let boxes = [];
  const look = async () => {
    try {
      const r = await api("/api/adopt" + (folder.value.trim() ? "?path=" + encodeURIComponent(folder.value.trim()) : ""));
      boxes = [];
      found.replaceChildren(r.candidates.length ? el("div", {}, r.candidates.map(c => {
        const box = el("input", { type: "checkbox", disabled: !!c.problem, "aria-label": c.name });
        if (!c.problem) boxes.push([box, c.name]);
        return el("label", { style: "display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)" }, box,
          el("div", { style: "min-width:0" },
            el("div", {}, el("span", { class: "mono" }, c.name), " ", el("span", { class: "pill" }, c.found_in)),

      })) : el("p", { class: "muted" }, "No skills found that Loadout doesn't already manage."));
    } catch (e) { toast(e.message, true); }
  };
  const adopt = async () => {
    const skills = boxes.filter(([b]) => b.checked).map(([, n]) => n);
    if (!skills.length) { toast("Select at least one skill", true); return; }
    try {
      const r = await api("/api/adopt", { into: into.value, skills, path: folder.value.trim() });
      result.replaceChildren(

        r.adopted.length ? el("p", { class: "muted" }, "Once the source ships them, move your originals aside so the next sync installs the shared versions.") : null);
      await look();

  };
  openDrawer(el("h2", {}, "Share skills you already have"),
    el("p", { class: "muted" }, "Skills in your AI tools that Loadout didn't install (or in a folder you name). Adding them copies them into a source's working copy, so you can share them through a pull request."),
    el("div", { class: "row" }, folder, el("button", { class: "btn", onclick: look }, "Look")),
    found,
    el("div", { class: "row", style: "margin-top:14px" }, "Add to source", into, el("button", { class: "btn primary", onclick: adopt }, "Add selected to source")),
    result);
  await look();
}

const PLACEHOLDER = /\{\{\s*([A-Za-z_][A-Za-z0-9_-]*)\s*\}\}/g;
const VARNAME = /^[A-Za-z_][A-Za-z0-9_-]*$/;
const placeholdersIn = text => new Set([...text.matchAll(PLACEHOLDER)].map(m => m[1]));

// A template's SKILL.md from the form. Values are JSON-quoted.
function templateText(f) {
  const q = JSON.stringify;
  const lines = ["---", `name: ${f.name}`, `description: ${q(f.description)}`, "template:"];
  if (f.about) lines.push(`  description: ${q(f.about)}`);
  if (f.vars.length) {
    lines.push("  variables:");
    for (const v of f.vars) lines.push(`    - { name: ${v.name}` + (v.description ? `, description: ${q(v.description)}` : "") + (v.default !== undefined ? `, default: ${q(v.default)}` : "") + " }");
  }
  if (!f.about && !f.vars.length) lines[lines.length - 1] = "template: {}";
  if (f.tags.length) lines.push("loadout:", `  tags: ${q(f.tags)}`);
  lines.push("---", "", f.body.trim() || `# ${f.name || "Template"}\n\nThe steps the agent should follow.`, "");
  return lines.join("\n");
}

function newTemplate(sources, start) {
  const into = el("select", { "aria-label": "Source" }, srcOptions(sources));
  const name = el("input", { type: "text", placeholder: "oncall-runbook", "aria-label": "Template name" });
  const about = el("input", { type: "text", placeholder: "What to do when paged. Each team adds its own channels.", "aria-label": "What the template is for" });
  const desc = el("textarea", { style: "min-height:56px", placeholder: "{{team}}'s on-call runbook. Use when handling an alert for {{team}}'s services.", "aria-label": "Skill description" });
  const tags = el("input", { type: "text", placeholder: "on-call, incidents", "aria-label": "Tags" });
  const body = el("textarea", { style: "min-height:200px", placeholder: "# {{team}} on-call\n\n1. …", "aria-label": "Instructions" });
  const varsBox = el("div");
  const inserts = el("div", { class: "row" });
  const problems = el("div");
  const preview = el("pre", { style: "max-height:300px;overflow:auto" });
  const result = el("div");
  let vars = [];
  let lastText = body;
  let mode = "filled";
  for (const t of [desc, body]) t.addEventListener("focus", () => (lastText = t));

  const form = () => ({ name: name.value.trim(), about: about.value.trim(), description: desc.value.trim().replace(/\s+/g, " "), tags: list(tags.value), body: body.value,
    vars: vars.map(v => ({ name: v.name.trim(), description: v.description.trim() || undefined, default: v.optional ? v.default : undefined })) });
  const check = f => {
    const used = placeholdersIn(f.description + "\n" + f.body);
    const declared = f.vars.map(v => v.name);
    return [
      !KEBAB.test(f.name) && "Template name: lowercase letters, digits and single '-' (e.g. oncall-runbook).",
      !f.description && "Skill description: say what the finished skill does and when to use it.",
      ...f.vars.filter(v => !VARNAME.test(v.name)).map(v => `Blank "${v.name}": start with a letter; letters, digits, _ and - only.`),
      ...declared.filter((n, i) => declared.indexOf(n) !== i).map(n => `Blank "${n}" is listed twice.`),
      ...[...used].filter(n => !declared.includes(n)).map(n => `{{${n}}} is used but isn't in the list of blanks. Add it below.`),
      f.tags.some(t => !KEBAB.test(t)) && "Tags: kebab-case words.",
    ].filter(Boolean).concat(declared.filter(n => VARNAME.test(n) && !used.has(n)).map(n => `Tip: the blank "${n}" isn't used in the text yet.`));
  };
  const example = f => { const vals = {}; for (const v of f.vars) vals[v.name] = v.default ?? `‹${v.name}›`; return vals; };
  const update = () => {
    const f = form();
    const text = templateText(f);
    preview.textContent = mode === "file" ? text : text.replace(PLACEHOLDER, (m, n) => { const e = example(f); return n in e ? e[n] : m; }).replace(/\ntemplate:[\s\S]*?\n(?=[a-z]|---)/, "\n");
    problems.replaceChildren(...check(f).map(p => el("div", { class: p.startsWith("Tip") ? "muted" : "warn" }, p)));
    inserts.replaceChildren(el("span", { class: "muted" }, "Insert a blank:"), ...f.vars.filter(v => VARNAME.test(v.name)).map(v =>
      el("button", { class: "btn", type: "button", onclick: () => insertAt(lastText, `{{${v.name}}}`) }, `{{${v.name}}}`)));
  };
  const insertAt = (t, s) => { const a = t.selectionStart ?? t.value.length, b = t.selectionEnd ?? a; t.value = t.value.slice(0, a) + s + t.value.slice(b); t.focus(); t.selectionStart = t.selectionEnd = a + s.length; update(); };
  const renderVars = () => {
    varsBox.replaceChildren(...vars.map((v, i) => {
      const n = el("input", { type: "text", value: v.name, placeholder: "team", "aria-label": "Blank name", style: "width:130px" });
      const d = el("input", { type: "text", value: v.description, placeholder: "The question people see, e.g. Your team's name", "aria-label": "Question", class: "grow" });
      const opt = el("input", { type: "checkbox", checked: v.optional, "aria-label": "Has a default" });
      const def = el("input", { type: "text", value: v.default, placeholder: v.optional ? "" : "required", "aria-label": "Default", style: "width:110px", disabled: !v.optional });
      n.oninput = () => { v.name = n.value; update(); };
      d.oninput = () => { v.description = d.value; update(); };
      opt.onchange = () => { v.optional = opt.checked; def.disabled = !opt.checked; def.placeholder = opt.checked ? "" : "required"; update(); };
      def.oninput = () => { v.default = def.value; update(); };
      return el("div", { class: "row var-row" }, n, d, el("label", { class: "row muted", title: "Without a default, people must fill it in" }, opt, "default"), def,
        el("button", { class: "btn ghost", type: "button", "aria-label": "Remove", onclick: () => { vars.splice(i, 1); renderVars(); } }, "✕"));
    }), el("div", { class: "row" }, el("button", { class: "btn", type: "button", onclick: () => { vars.push({ name: "", description: "", optional: false, default: "" }); renderVars(); } }, "+ Add a blank")));
    update();
  };
  const fill = t => {
    name.value = t.name || ""; about.value = t.about || ""; desc.value = t.description || ""; tags.value = t.tags || ""; body.value = t.body || "";
    vars = (t.vars || []).map(v => ({ name: v.name, description: v.description || "", optional: v.default !== undefined, default: v.default ?? "" }));
    renderVars();
  };
  // Start from a skill in one of your sources: its text becomes the body.
  const fromSrc = el("select", { "aria-label": "Source of the skill" }, sources.map(s => el("option", { value: s.name }, s.name)));
  const fromSkill = el("input", { type: "text", placeholder: "write-spec", "aria-label": "Skill name", style: "width:160px" });
  const loadSkill = async () => {
    try {
      const r = await api(`/api/source-item?source=${encodeURIComponent(fromSrc.value)}&key=${encodeURIComponent("skill/" + fromSkill.value.trim())}`);
      if (!r.text) { toast(`${fromSrc.value} has no skill named ${fromSkill.value.trim()}`, true); return; }
      const m = r.text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
      const d = m && m[1].match(/^description:\s*(.*)$/m);
      let dv = d ? d[1].trim() : "";
      if (/^["']/.test(dv)) { try { dv = JSON.parse(dv.replace(/^'(.*)'$/, (_, x) => JSON.stringify(x.replace(/''/g, "'")))); } catch (_) {} }
      fill({ name: fromSkill.value.trim() + "-template", description: dv, body: m ? m[2] : r.text, vars: [] });
      toast("Loaded. Now replace the team-specific parts with blanks like {{team}}.");
    } catch (e) { toast(e.message, true); }
  };
  const starters = el("div", { class: "row" }, el("span", { class: "muted" }, "Start from:"),
    el("button", { class: "btn", type: "button", onclick: () => fill({}) }, "Blank"),
    STARTERS.map(t => el("button", { class: "btn", type: "button", onclick: () => fill(t) }, t.label)));
  const create = async () => {
    const f = form();
    const bad = check(f).filter(p => !p.startsWith("Tip"));
    if (bad.length) { toast(bad.join("\n"), true); return; }
    try {
      const r = await api("/api/source-template", { source: into.value, name: f.name, text: templateText(f), create: true });
      const msg = el("input", { type: "text", class: "grow", value: `Add the ${f.name} template`, "aria-label": "Pull request title" });
      result.replaceChildren(el("div", { class: "card", style: "margin-top:14px" },
        el("div", { class: "ok" }, `Saved template ${f.name} in your working copy of ${into.value}`), el("div", { class: "mono muted" }, r.path),
        (r.warnings || []).map(w => el("div", { class: "muted" }, w)),
        el("p", { class: "muted" }, "Next, open a pull request. Once it's merged and people sync, the template appears on their Templates page."),
        el("div", { class: "row" }, msg, el("button", { class: "btn primary", onclick: () => exportPr(into.value, msg.value) }, "Open pull request"))));
    } catch (e) { toast(e.message, true); }
  };
  for (const i of [name, about, desc, tags, body]) i.oninput = update;
  const modeBtn = (m, label) => el("button", { class: "btn" + (mode === m ? " primary" : ""), type: "button", onclick: e => { mode = m; for (const b of e.target.parentNode.querySelectorAll("button")) b.classList.toggle("primary", b === e.target); update(); } }, label);
  fill(start || {});
  if (start && start.into) into.value = start.into;
  openDrawer(el("h2", {}, "New template"),
    el("p", { class: "muted" }, "A template is a skill with blanks. Other teams pick it on the Templates page, answer a few questions, and get their own copy. Write it like a normal skill, and put ", el("code", {}, "{{name}}"), " wherever a team's own answer should go."),
    starters,
    el("div", { class: "row" }, el("span", { class: "muted" }, "…or a skill you have:"), fromSrc, fromSkill, el("button", { class: "btn", type: "button", onclick: loadSkill }, "Load")),
    el("h3", {}, "1. About the template"),
    el("div", { class: "form-grid" },
      el("label", {}, "Save in source"), into,
      el("label", {}, "Template name"), name,
      el("label", {}, "What it's for"), about, el("div", { class: "hint" }, "Shown to people choosing a template."),
      el("label", {}, "Tags"), tags),
    el("h3", {}, "2. The blanks people fill in"),
    el("p", { class: "muted", style: "margin-top:0" }, "Each blank becomes a question. Give it a default if most teams can keep it."),
    varsBox,
    el("h3", {}, "3. The skill"),
    el("div", { class: "form-grid" },
      el("label", {}, "Skill description"), desc, el("div", { class: "hint" }, "What the finished skill does, then \"Use when …\". Blanks are allowed here too."),
      el("label", {}, "Instructions"), body),
    inserts,
    problems,
    el("div", { class: "row", style: "margin-top:14px" }, el("h3", { style: "margin:0" }, "Preview"), el("span", { class: "grow" }),
      el("div", { class: "row" }, modeBtn("filled", "With example answers"), modeBtn("file", "SKILL.md file"))),
    preview,
    el("div", { class: "row", style: "margin-top:14px" }, el("button", { class: "btn primary", onclick: create }, "Save template")), result);
  document.getElementById("drawer").classList.add("wide");
}

function useTemplate(t, sources) {
  const inputs = {};
  const name = el("input", { type: "text", value: t.name, "aria-label": "Skill name" });
  const into = el("select", { "aria-label": "Destination source" }, srcOptions(sources.filter(s => s.name !== t.source).concat(sources.filter(s => s.name === t.source))));
  const result = el("div");
  const fields = t.variables.map(v => {
    inputs[v.name] = el("input", { type: "text", value: v.default ?? "", placeholder: v.default === undefined ? "required" : "", "aria-label": v.name });
    return [el("label", { class: "mono" }, v.name), inputs[v.name], v.description ? el("div", { class: "hint" }, v.description) : null];
  });
  const create = async () => {
    const values = {};
    for (const [k, i] of Object.entries(inputs)) values[k] = i.value;
    const missing = t.variables.filter(v => v.default === undefined && !values[v.name].trim()).map(v => v.name);
    if (missing.length) { toast("Fill in: " + missing.join(", "), true); return; }
    try {
      const r = await api("/api/template-use", { template: t.id, into: into.value, name: name.value, values });
      const msg = el("input", { type: "text", class: "grow", value: `Add ${name.value} from ${t.name} template`, "aria-label": "Pull request title" });
      result.replaceChildren(el("div", { class: "card", style: "margin-top:14px" },
        el("div", { class: "ok" }, `Created ${r.id}`), el("div", { class: "mono muted" }, r.path),
        (r.warnings || []).map(w => el("div", { class: "warn" }, w)),
        el("div", { class: "row", style: "margin-top:10px" }, el("button", { class: "btn", onclick: () => editItem(r.source, "skill/" + name.value) }, "Review in editor")),
        el("div", { class: "row" }, msg, el("button", { class: "btn primary", onclick: () => exportPr(r.source, msg.value) }, "Open pull request"))));
    } catch (e) { toast(e.message, true); }
  };
  openDrawer(el("h2", {}, "Use the ", el("code", {}, t.name), " template"),
    el("p", { class: "muted" }, "Answer the questions below. You get your own copy of the skill, with your answers filled in, which you can edit before sharing."),
    t.description ? el("p", { class: "muted" }, t.description) : null,
    el("div", { class: "form-grid" }, fields, el("label", {}, "Skill name"), name, el("label", {}, "Add to source"), into,
      el("div", { class: "hint" }, "Saved to your working copy of that source. Nothing is shared until you open a pull request.")),
    el("div", { class: "row", style: "margin-top:14px" }, el("button", { class: "btn primary", onclick: create }, "Create skill")), result);
}

async function show(tab, opts, keepScroll) {
  current = tab;
  if (location.hash !== "#" + tab) history.pushState(null, "", "#" + tab);
  closeDrawer();
  renderNav();
  const m = document.getElementById("main");
  const y = window.scrollY;
  if (!keepScroll) m.replaceChildren(el("div", { class: "muted" }, "Loading…"));
  const frag = el("div");
  try { await views[tab](frag, opts); m.replaceChildren(frag); }
  catch (e) { m.replaceChildren(el("div", { class: "card bad" }, e.message)); }
  if (keepScroll) window.scrollTo(0, y);
  refreshStatus();
}
function renderNav() {
  const nav = document.getElementById("nav");
  let group = null;
  nav.replaceChildren(...tabs.flatMap(([t, label, g, hint]) => [
    g !== group && (group = g) ? el("div", { class: "nav-group" }, g) : null,
    el("button", { class: t === current ? "on" : "", title: hint, "aria-current": t === current ? "page" : null, onclick: () => show(t) },
      label, t === "Review" && pendingCount ? el("span", { class: "count" }, pendingCount) : null)]).filter(Boolean));
}
async function refreshStatus() {
  try {
    const st = await api("/api/status");
    document.getElementById("fp").textContent = st.fingerprint || "";
    document.getElementById("last-sync").textContent = "Last updated: " + ago(st.last_sync);
    if (pendingCount !== st.pending.length) { pendingCount = st.pending.length; renderNav(); }
  } catch (_) {}
  refreshAbout();
}
// Version and repo link; the release lookup runs in the background when `lo ui` starts.
async function refreshAbout() {
  try {
    const ab = await api("/api/about");
    const ext = { target: "_blank", rel: "noopener noreferrer" };
    document.getElementById("about").replaceChildren(
      el("a", { href: ab.repo, title: "Loadout on GitHub", ...ext }, `Loadout v${ab.version}`),
      ab.update_available ? el("div", {},
        el("a", { class: "update", href: `${ab.repo}/releases/latest`, title: "What's new in this release", ...ext }, `Update available: v${ab.latest}`),
        el("div", {}, "Install it with ", el("span", { class: "mono" }, "lo self-update"))) : null);
    return ab;
  } catch (_) { return null; }
}
// The first lookup may still be running; look again shortly.
setTimeout(refreshAbout, 4000);
const fromHash = () => { const t = decodeURIComponent(location.hash.slice(1)); return tabs.some(([n]) => n === t) ? t : null; };
window.addEventListener("hashchange", () => { const t = fromHash() || "Overview"; if (t !== current) show(t); });
// First visit: people who haven't finished setting up land on Start here.
(async () => {
  let first = fromHash();
  if (!first) {
    try { const st = await api("/api/status"); first = st.sources && st.enabled_items ? "Overview" : "Start"; }
    catch (_) { first = "Start"; }
  }
  show(first);
})();
</script>
